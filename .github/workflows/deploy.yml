name: Deploy to VPS (Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-docker-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate required secrets/variables
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          test -n "$VPS_HOST" || (echo "Missing secret: VPS_HOST" && exit 1)
          test -n "$VPS_USER" || (echo "Missing secret: VPS_USER" && exit 1)
          test -n "$VPS_SSH_PRIVATE_KEY" || (echo "Missing secret: VPS_SSH_PRIVATE_KEY" && exit 1)
          test -n "$VPS_PORT" || (echo "Missing variable: VPS_PORT" && exit 1)
          test -n "$DEPLOY_PATH" || (echo "Missing variable: DEPLOY_PATH" && exit 1)

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS (git pull + docker compose build/up)
        run: |
          ssh -p "${{ vars.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -euo pipefail

            cd "${{ vars.DEPLOY_PATH }}"

            git fetch origin main
            git reset --hard origin/main

            docker compose build frontend api admin
            docker compose up -d

            # Optional cleanup: remove dangling images
            docker image prune -f || true

            docker compose ps
          EOF
