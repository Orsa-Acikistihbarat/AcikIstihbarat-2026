server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file falls back to
    # index.html so React Router can handle client-side routes (e.g. /login,
    # /haberler, /adminpanel/bultenlerekimleraboneoldu) on hard load/refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
